<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Vault Rahasia Multi-User</title><style>body{font-family:'Courier New',Courier,monospace;background-color:#121212;color:#0f0;margin:0;padding:20px;display:flex;justify-content:center}.container{background:#1e1e1e;padding:20px;border-radius:8px;border:1px solid #333;width:100%;max-width:500px}input,button{width:100%;padding:10px;margin:8px 0;background:#2a2a2a;color:#0f0;border:1px solid #555;box-sizing:border-box}button{cursor:pointer;font-weight:bold}button:hover{background:#333}.btn-green{background:#004d00;border-color:#0f0}.btn-blue{background:#003366;border-color:#06c;color:#6b3ff}.btn-red{background:#4d0000;border-color:#f00;color:#f66}.list-item{background:#2a2a2a;padding:15px;margin-top:15px;border-left:3px solid #0f0;border-radius:4px;display:flex;flex-direction:column;gap:8px}.thumbnail{width:100%;border-radius:4px;border:1px solid #444;margin-top:5px}.action-row{display:flex;gap:5px}.action-row button{margin:0;padding:5px;font-size:12px}#app-section{display:none}.title-text{font-size:18px;font-weight:bold;color:#fff}.no-title{color:#888;font-style:italic}</style></head><body><div class="container"><div id="login-section"><h2>Akses Vault</h2><input type="text" id="userInput" placeholder="Username"><input type="password" id="passInput" placeholder="Password"><div style="display:flex;gap:10px;"><button onclick="auth('login')" class="btn-green">Masuk</button><button onclick="auth('register')" class="btn-blue">Daftar Baru</button></div><div id="login-status" style="margin-top:10px;font-size:14px;"></div></div><div id="app-section"><h2 id="welcome-text">Vault Aktif</h2><button onclick="logout()" style="background:transparent;border:none;text-decoration:underline;width:auto;float:right;">Logout</button><input type="text" id="judul" placeholder="Judul / Catatan (Opsional)"><input type="text" id="link" placeholder="Link URL (Opsional)"><button onclick="saveData()" class="btn-green" id="btnSave">Simpan Data</button><h3 style="border-bottom:1px solid #555;padding-bottom:5px;margin-top:25px;">Data Milikmu</h3><button onclick="loadData()" style="font-size:12px;padding:5px;">Refresh Data</button><div id="data-list">Sedang memuat data...</div><button onclick="nukeData()" class="btn-red" style="margin-top:30px;">☢️ LEDAKKAN SEMUA DATAKU ☢️</button></div></div>
<script>
const _u = atob('aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J3YjhOVDVNTUYwSmQwU29YSER2dHlkNzNBdHpHblNLWWNGRHpReGgzdmRzTUNVQ1phTFFYbm1JNVh1SGlqTk96Zm9ldy9leGVj');
window.onload=()=>{const u=localStorage.getItem('vault_user'),p=localStorage.getItem('vault_pass');if(u&&p){document.getElementById('userInput').value=u;document.getElementById('passInput').value=p;auth('login');}};
function auth(a){const u=document.getElementById('userInput').value,p=document.getElementById('passInput').value;if(!u||!p)return alert("Username dan Password wajib diisi!");const s=document.getElementById('login-status');s.innerText="Memproses...";const f=new FormData();f.append('action',a);f.append('username',u);f.append('password',p);fetch(_u,{method:'POST',body:f}).then(r=>r.json()).then(d=>{if(d.status==="success"){if(a==='register'){s.style.color="lightblue";s.innerText=d.message;}else{localStorage.setItem('vault_user',u);localStorage.setItem('vault_pass',p);document.getElementById('login-section').style.display='none';document.getElementById('app-section').style.display='block';document.getElementById('welcome-text').innerText="Vault: "+u;loadData();}}else{s.style.color="red";s.innerText=d.message;}}).catch(()=>s.innerText="Error jaringan!");}
function logout(){localStorage.removeItem('vault_user');localStorage.removeItem('vault_pass');location.reload();}
function generateFormData(a){const f=new FormData();f.append('username',localStorage.getItem('vault_user'));f.append('password',localStorage.getItem('vault_pass'));f.append('action',a);return f;}
function saveData(){const jI=document.getElementById('judul').value.trim(),lI=document.getElementById('link').value.trim();if(!jI&&!lI)return alert("Minimal isi salah satu kolom (Judul atau Link)!");const j=jI===""?"(Tanpa Judul)":jI,l=lI===""?"-":lI;document.getElementById('btnSave').innerText="Menyimpan...";const f=generateFormData('save');f.append('judul',j);f.append('link',l);fetch(_u,{method:'POST',body:f}).then(()=>{document.getElementById('judul').value='';document.getElementById('link').value='';document.getElementById('btnSave').innerText="Simpan Data";loadData();});}
function loadData(){document.getElementById('data-list').innerHTML="Memuat data...";fetch(_u,{method:'POST',body:generateFormData('read')}).then(r=>r.json()).then(d=>renderData(d.data));}
function renderData(a){const l=document.getElementById('data-list');l.innerHTML='';if(a.length===0){l.innerHTML="<p>Belum ada data tersimpan.</p>";return;}a.reverse().forEach(i=>{const aL=i.link&&i.link!=="-",tU=aL?`https://image.thum.io/get/width/400/crop/800/${i.link}`:"",iN=i.judul==="(Tanpa Judul)",tC=iN?"title-text no-title":"title-text",d=document.createElement('div');d.className='list-item';let iH=aL?`<img src="${tU}" class="thumbnail" loading="lazy" onerror="this.style.display='none'" alt="Thumbnail">`:"",bC=aL?`<button class="btn-green" onclick="copyToClipboard('${i.link}')">Copy Link</button>`:"";d.innerHTML=`<div class="${tC}">${i.judul}</div><div style="font-size: 12px; word-break: break-all; color: #888;">${i.link}</div>${iH}<div class="action-row" style="margin-top: 5px;"><button class="btn-green" onclick="copyToClipboard('${i.judul}')">Copy Judul</button>${bC}<button class="btn-red" onclick="deleteItem('${i.id}')">Hapus</button></div>`;l.appendChild(d);});}
function deleteItem(id){if(!confirm("Yakin ingin menghapus data ini?"))return;const f=generateFormData('delete');f.append('id',id);fetch(_u,{method:'POST',body:f}).then(()=>loadData());}
function copyToClipboard(t){if(t==="-"||t==="(Tanpa Judul)")return alert("Tidak ada data valid untuk dicopy.");navigator.clipboard.writeText(t).then(()=>alert("Tercopy: "+t));}
function nukeData(){if(confirm("BOM DATAKU: Yakin ingin menghapus SEMUA data milikmu? Data user lain aman.")){if(confirm("Beneran 100% yakin? Ini tidak bisa dikembalikan!")){fetch(_u,{method:'POST',body:generateFormData('nuke')}).then(()=>{alert("BOM! Semua datamu telah hangus.");loadData();});}}}
</script>
</body></html>
